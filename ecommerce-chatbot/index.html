<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUAARK — Shopping Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!--
    Embeddable chat block — mobile sized.
    Drop into any site with:
      <iframe src="…/e-shopping-chat-bot/index.html" style="width:400px;height:720px;border:0" title="FUAARK Assistant"></iframe>
  -->
  <main class="chat-shell">
    <header class="chat-header">
      <div class="peer">
        <div class="peer-avatar">
          <img src="logo.png" alt="FUAARK Assistant" class="peer-avatar-img" />
          <span class="peer-dot"></span>
        </div>
        <div class="peer-meta">
          <strong>FUAARK <em>Assistant</em></strong>
          <small id="peer-status">Online · replies instantly</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="restart-btn" title="Restart demo">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="icon-btn bag-btn" id="bag-btn" title="Your bag">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="bag-count" id="bag-count" hidden>0</span>
        </button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <footer class="composer">
      <div class="input-row">
        <input type="text" id="composer-input" placeholder="Type a message…" autocomplete="off" />
        <button class="send-btn" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
