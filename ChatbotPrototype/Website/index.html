    header {

    }
    .btn {
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .btn-primary {
      background: #ef590c;
      color: #fff;
    }

      color: #e2e8f0;
